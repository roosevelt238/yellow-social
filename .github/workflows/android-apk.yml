name: Build Yellow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Extract Yellow
        run: |
          unzip -q Yellow_Android_APK_Build_Kit-1.zip
          cd Yellow_Android_APK_Build_Kit
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Yellow-APK
          path: Yellow_Android_APK_Build_Kit/android/app/build/outputs/apk/debug/app-debug.apk
